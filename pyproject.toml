[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-circuit"
version = "0.1.0"
description = "Residual EML circuit layers and benchmark utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["eml_circuit*"]
